name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Check the release commit
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Pin an OIDC-capable npm rather than relying on the runner's bundled version.
      - run: npm install --global npm@12.1.0
      - name: Check release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('package.json', 'utf8'));
          const lock = JSON.parse(await readFile('package-lock.json', 'utf8'));
          assert.equal(process.env.RELEASE_TAG, `v${manifest.version}`, 'Release tag must match package.version');
          assert.equal(lock.version, manifest.version);
          assert.equal(lock.packages[''].version, manifest.version);
          assert.equal(manifest.repository?.type, 'git');
          assert.equal(manifest.repository?.url, `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`);
          NODE
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run size
      - name: Pack the release archive
        id: pack
        run: |
          mkdir -p .artifacts/package
          npm pack --ignore-scripts --json --pack-destination .artifacts/package > .artifacts/package/pack.json
          archive=$(node --input-type=module -e "import fs from 'node:fs'; console.log(Object.values(JSON.parse(fs.readFileSync('.artifacts/package/pack.json', 'utf8')))[0].filename)")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          cd .artifacts/package
          sha256sum "$archive" > "$archive.sha256"
          npm publish "$archive" --dry-run --access public --ignore-scripts --registry https://registry.npmjs.org
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-package-evidence
          path: .artifacts/package/
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish the archive with npm OIDC
        working-directory: .artifacts/package
        env:
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: |
          sha256sum --check "$ARCHIVE.sha256"
          npm publish "$ARCHIVE" --access public --ignore-scripts --registry https://registry.npmjs.org
